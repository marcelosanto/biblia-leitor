[package]
name = "biblia_egui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }

[features]
# Fonte serifada opcional: coloque assets/fonts/Literata.ttf e use --features fonte_serif
fonte_serif = []

# --- SQLite só fora da web ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }

# --- DESKTOP (Linux/Windows/macOS) ---
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
env_logger = "0.11.11"

# --- ANDROID ---
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "android-native-activity",
] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15.1"
android-activity = "0.6.1"

# --- WEB (wasm32) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Storage",
] }
serde_json = "1"

[profile.release]
opt-level = "s" # binário menor para a web
lto = true

[package.metadata.android]
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
package = "rust.biblia_egui"
min_sdk_version = 23
target_sdk_version = 33
